<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Todoリスト{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="header">
    <a href="{{ url_for('index') }}" class="logo">✓ Todo List</a>
    <a href="{{ url_for('new') }}" class="btn btn-primary">＋ 新しく登録</a>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for msg_type, message in messages %}
        <div class="flash flash-{{ msg_type }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <script>
    // 二重送信の防止：送信したらボタンを押せなくする
    document.addEventListener("submit", function (e) {
      if (e.defaultPrevented) return;  // 削除の確認で「キャンセル」したときは何もしない
      var btn = e.target.querySelector("button[type=submit]");
      if (!btn) return;
      if (btn.dataset.loading) btn.textContent = btn.dataset.loading;
      btn.disabled = true;
      e.target.classList.add("is-sending");
    });
    // ブラウザの「戻る」で戻ってきたとき、ボタンを元に戻す
    window.addEventListener("pageshow", function (e) {
      if (e.persisted) location.reload();
    });
  </script>
</body>
</html>
